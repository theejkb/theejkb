name: Profile

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # every day, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  # 1. Stats + languages cards (own script, GitHub GraphQL, no third-party service)
  #    and 3D contribution calendar — all committed to this repo.
  cards:
    name: Stats cards & 3D calendar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate stats.svg & langs.svg
        run: node .github/scripts/stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets profile-3d-contrib
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore(profile): refresh stats & 3D calendar [skip ci]"
            git pull --rebase origin main
            git push
          fi

  # 2. Contribution snake → branch `output`
  snake:
    name: Contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3. WakaTime weekly breakdown — only runs once the WAKATIME_API_KEY secret exists
  wakatime:
    name: WakaTime
    needs: cards
    runs-on: ubuntu-latest
    steps:
      - id: check
        run: echo "enabled=${{ secrets.WAKATIME_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.enabled == 'true'
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: true
          SHOW_TOTAL: true
          TIME_RANGE: last_7_days
          LANG_COUNT: 6
          PROGRESS_SYMBOL_VERSION: 2
          COMMIT_MESSAGE: "chore(profile): update WakaTime stats [skip ci]"

      - if: steps.check.outputs.enabled != 'true'
        run: echo "WAKATIME_API_KEY secret not set — skipping."
